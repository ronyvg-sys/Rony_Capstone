# Pytest config for the W12 debugging drill tests.
# Some managed course environments (e.g. Vocareum) ship a broken third-party
# pytest plugin whose entrypoint points at a missing module, crashing pytest at
# startup before any test runs. Block the usual offender by name here; smoke_test.sh
# also sets PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 as a name-agnostic safety net.
[pytest]
addopts = -p no:langsmith_plugin -p no:langsmith
